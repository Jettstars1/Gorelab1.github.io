<script>

  pool:{name:'Swimming pool',theme:'pool',gy:640,solids:[[0,640,470,H+400],[1130,640,W,H+400],[470,872,1130,H+400]],fluids:[{x0:470,x1:1130,y0:668,y1:872,type:'water'}]},
  lava:{name:'Lava forge',theme:'lava',gy:660,solids:[[0,660,520,H+400],[1080,660,W,H+400],[520,885,1080,H+400]],fluids:[{x0:520,x1:1080,y0:712,y1:885,type:'lava'}]},
  flooded:{name:'Flooded chamber',theme:'lab',gy:842,solids:[[0,842,W,H+400]],fluids:[{x0:WL,x1:WR,y0:742,y1:842,type:'water'}]},
};
let MAP=MAPS.lab,MAPID='lab',SOLIDS=[],FLUIDS=[],wander=true;
function groundY(x){let y=H+400;for(const s of SOLIDS)if(x>=s.x0&&x<=s.x1&&s.y0<y)y=s.y0;return y}
function floorBelow(x,y){let r=H+400;for(const s of SOLIDS)if(x>=s.x0&&x<=s.x1&&s.y0>=y-1&&s.y0<r)r=s.y0;return r}
function solidAt(x,y){for(const s of SOLIDS)if(x>s.x0&&x<s.x1&&y>s.y0&&y<s.y1)return s;return null}

function fluidAt(x,y){for(const f of FLUIDS)if(x>=f.x0&&x<=f.x1&&y>=f.y0&&y<=f.y1)return f;return null}
function surfAt(f,x){const i=clamp(Math.round((x-f.x0)/8),0,f.n-1);return f.y0+f.h[i]}
function solidPush(p,r){
  for(const s of SOLIDS){if(p.x+r<=s.x0||p.x-r>=s.x1||p.y+r<=s.y0||p.y-r>=s.y1)continue;
    const top=p.y+r-s.y0,left=p.x+r-s.x0,right=s.x1-(p.x-r);let m=top,n=0;

    if(n===0){p.y=s.y0-r;return SPN.set(0,-1,p.x,s.y0)}if(n===1){p.x=s.x0-r;return SPN.set(-1,0,s.x0,p.y)}p.x=s.x1+r;return SPN.set(1,0,s.x1,p.y)}
  return null}
const SPN={nx:0,ny:0,cx:0,cy:0,set(a,b,c,d){this.nx=a;this.ny=b;this.cx=c;this.cy=d;return this}};
let G=0.5, gravityOn=true, paused=false, slow=false, muted=false;
const SUB=2, ITER=6;
let DT=0.5, DTP=0.5, frame=0, shake=0;
let bodies=[], sticks=[], embeds=[], blood=[], gibs=[], fx=[], tracers=[], bubbles=[], runs=[], ceilDrips=[];
let idc=1; const hitCD=new Map();
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stain=document.createElement('canvas');stain.width=W*2;stain.height=H*2;const sctx=stain.getContext('2d');sctx.setTransform(2,0,0,2,0,0);
const cam={x:W/2,y:H/2,z:1};
function clampCam(){const hw=W/(2*cam.z),hh=H/(2*cam.z);cam.x=clamp(cam.x,hw,W-hw);cam.y=clamp(cam.y,hh,H-hh)}
let scale=1,ox=0,oy=0,dpr=1;
function resize(){const r=cv.parentElement.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);scale=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;}
window.addEventListener('resize',resize);

// ================= physics primitives =================
function mkBody(kind){const b={born:frame,id:idc++,kind,points:[],caps:[],mass:0,ig:null,deleted:false,bloody:0,burn:0};bodies.push(b);return b}
function addP(b,x,y,r,m){const p={x,y,px:x,py:y,ax:0,ay:0,r,w:m>0?1/m:0,w0:m>0?1/m:0,m,body:b,pinned:false,gt:-99,fr:0.55,bounce:0,hidden:false};b.points.push(p);b.mass+=m;return p}
function addS(b,a,c,k=1,opt){const s={a,b:c,len:Math.hypot(c.x-a.x,c.y-a.y),k,k0:k,owner:b,dead:false,rope:false,minOnly:false,muscle:false,bones:null};if(opt)Object.assign(s,opt);sticks.push(s);return s}
function addC(b,a,c,r,opt){const cp={id:idc++,a,b:c,r,body:b,s0:0,s1:1,sharp:0,tip:null,saw:false,crush:false,bone:null,off:false,emb:null};if(opt)Object.assign(cp,opt);b.caps.push(cp);return cp}
function pinPoint(p,on){p.pinned=on;p.w=on?0:p.w0;p.px=p.x;p.py=p.y}
function kick(p,vx,vy){ if(p.w===0)return; p.px-=vx*DT; p.py-=vy*DT; }
function velOf(p){return [(p.x-p.px)/DT,(p.y-p.py)/DT]}

function solveStick(s){
  if(s.dead||s.k<=0)return;const a=s.a,b=s.b;const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1e-6;
  if(s.rope&&d<=s.len)return; if(s.minOnly&&d>=s.len)return;
  const ws=a.w+b.w;if(ws===0)return;const f=(d-s.len)/d*s.k/ws;
  a.x+=dx*f*a.w;a.y+=dy*f*a.w;b.x-=dx*f*b.w;b.y-=dy*f*b.w;
}
const SC={s:0,t:0,x1:0,y1:0,x2:0,y2:0};
function segClosest(ax,ay,bx,by,cx,cy,dx,dy){
  const d1x=bx-ax,d1y=by-ay,d2x=dx-cx,d2y=dy-cy,rx=ax-cx,ry=ay-cy;
  const a=d1x*d1x+d1y*d1y,e=d2x*d2x+d2y*d2y,f=d2x*rx+d2y*ry;let s,t;
  if(a<=1e-6&&e<=1e-6){s=0;t=0}
  else if(a<=1e-6){s=0;t=clamp(f/e,0,1)}
  else{const c=d1x*rx+d1y*ry;if(e<=1e-6){t=0;s=clamp(-c/a,0,1)}else{const b=d1x*d2x+d1y*d2y,den=a*e-b*b;s=den!==0?clamp((b*f-c*e)/den,0,1):0;t=(b*s+f)/e;if(t<0){t=0;s=clamp(-c/a,0,1)}else if(t>1){t=1;s=clamp((b-c)/a,0,1)}}}
  SC.s=s;SC.t=t;SC.x1=ax+d1x*s;SC.y1=ay+d1y*s;SC.x2=cx+d2x*t;SC.y2=cy+d2y*t;
}
function prepCap(c){const a=c.a,b=c.b;const dx=b.x-a.x,dy=b.y-a.y;c.ex0=a.x+dx*c.s0;c.ey0=a.y+dy*c.s0;c.ex1=a.x+dx*c.s1;c.ey1=a.y+dy*c.s1;
  c.x0=Math.min(c.ex0,c.ex1)-c.r;c.x1=Math.max(c.ex0,c.ex1)+c.r;c.y0=Math.min(c.ey0,c.ey1)-c.r;c.y1=Math.max(c.ey0,c.ey1)+c.r;}
function noCol(b1,b2){return (b1.ig&&b1.ig.get(b2.id)>0)||(b2.ig&&b2.ig.get(b1.id)>0)}
function igAdd(b,o,n){if(!b.ig)b.ig=new Map();b.ig.set(o.id,(b.ig.get(o.id)||0)+n)}
const CAPS=[];
function collideAll(){
  CAPS.length=0;
  for(const b of bodies){if(b.nocol)continue;for(const c of b.caps){if(c.off)continue;if(c.saw&&!c.body.on&&c.body.kind==='chainsaw')continue;prepCap(c);CAPS.push(c)}}
  CAPS.sort((u,v)=>u.x0-v.x0);
  const n=CAPS.length;
  for(let i=0;i<n;i++){const c1=CAPS[i];for(let j=i+1;j<n;j++){const c2=CAPS[j];if(c2.x0>c1.x1)break;if(c1.body===c2.body)continue;if(c2.y0>c1.y1||c2.y1<c1.y0)continue;if(noCol(c1.body,c2.body))continue;capCap(c1,c2)}}
}
function capCap(c1,c2){
  segClosest(c1.ex0,c1.ey0,c1.ex1,c1.ey1,c2.ex0,c2.ey0,c2.ex1,c2.ey1);
  const dx=SC.x1-SC.x2,dy=SC.y1-SC.y2,R=c1.r+c2.r,d2=dx*dx+dy*dy;if(d2>=R*R)return;
  let d=Math.sqrt(d2),nx,ny;if(d<1e-5){nx=0;ny=-1;d=0}else{nx=dx/d;ny=dy/d}

  const W1=same1?a1.w:a1.w*(1-u1)*(1-u1)+b1.w*u1*u1,W2=same2?a2.w:a2.w*(1-u2)*(1-u2)+b2.w*u2*u2,Wt=W1+W2;if(Wt<=0)return;
  const iv=1/DT;
  const v1x=same1?(a1.x-a1.px)*iv:((a1.x-a1.px)*(1-u1)+(b1.x-b1.px)*u1)*iv, v1y=same1?(a1.y-a1.py)*iv:((a1.y-a1.py)*(1-u1)+(b1.y-b1.py)*u1)*iv;
  const v2x=same2?(a2.x-a2.px)*iv:((a2.x-a2.px)*(1-u2)+(b2.x-b2.px)*u2)*iv, v2y=same2?(a2.y-a2.py)*iv:((a2.y-a2.py)*(1-u2)+(b2.y-b2.py)*u2)*iv;
  const rvx=v1x-v2x,rvy=v1y-v2y,vn=rvx*nx+rvy*ny,tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;
  const lam=(R-d)/Wt;
  a1.x+=nx*lam*wa1;a1.y+=ny*lam*wa1;if(!same1){b1.x+=nx*lam*wb1;b1.y+=ny*lam*wb1}
  a2.x-=nx*lam*wa2;a2.y-=ny*lam*wa2;if(!same2){b2.x-=nx*lam*wb2;b2.y-=ny*lam*wb2}

  const jt=-vt*0.2/Wt*DT;
  a1.px-=tx*jt*wa1;a1.py-=ty*jt*wa1;if(!same1){b1.px-=tx*jt*wb1;b1.py-=ty*jt*wb1}

  if(ny<-0.5){a1.gt=frame;b1.gt=frame} if(ny>0.5){a2.gt=frame;b2.gt=frame}
  if(c1.body.kind==='balloon'&&(c2.sharp||c2.saw||c2.body.burn>0))c1.body.popMe=true;else if(c2.body.kind==='balloon'&&(c1.sharp||c1.saw||c1.body.burn>0))c2.body.popMe=true;
  if(-vn>2.2||Math.abs(vt)>5||c1.saw||c2.saw||c1.crush||c2.crush){
    const cx=(SC.x1+SC.x2)/2,cy=(SC.y1+SC.y2)/2;
    handleHit(c1,u1,c2,u2,-vn,-rvx,-rvy,cx,cy,nx,ny);
    handleHit(c2,u2,c1,u1,-vn,rvx,rvy,cx,cy,-nx,-ny);
    if(-vn>6)impactSound(c1,c2,-vn);
  }
}
function surfHit(b,p,sp,nx,ny){
  if(b.kind==='person')groundHit(b,p,sp,nx,ny);
  else if(b.kind==='barrel'&&sp>20)b.hp=0;
}
function bounds(){
  for(const b of bodies){const n=b.points.length;for(let i=0;i<n;i++){const p=b.points[i];if(p.w===0)continue;
    const ovx=(p.x-p.px)/DT,ovy=(p.y-p.py)/DT;const c=solidPush(p,p.r);
    if(c){const nx=c.nx,ny=c.ny,vn=-(ovx*nx+ovy*ny);if(vn>0)surfHit(b,p,vn,nx,ny);p.ct=frame;p.cx=c.cx;p.cy=c.cy+(ny<0?2:0);
      if(ny<0){const vx=p.x-p.px;if(Math.abs(vx)<0.35*DT*p.fr*2){p.x=p.px}else p.px=p.x-vx*(1-p.fr);p.py=p.y+Math.max(0,ovy)*DT*p.bounce;p.gt=frame}

function explode(x,y,power){
  const R=190*power;
  for(const b of bodies){if(b.deleted)continue;for(const p of b.points){if(p.w===0)continue;const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy)||1;if(d>R)continue;const f=Math.pow(1-d/R,1.3)*30*power;kick(p,dx/d*f,dy/d*f-f*0.25)}
    if(b.kind==='person'){for(const B of [...b.bones]){if(B.gone)continue;const mx=(B.a.x+B.b.x)/2,my=(B.a.y+B.b.y)/2;const d=Math.hypot(mx-x,my-y);if(d>R*0.8)continue;const k=1-d/(R*0.8);const dmg=k*k*300*power;
      hurt(b,B.i,dmg,'blast',mx,my,mx-x,my-y);if(k>0.7&&!B.gone&&Math.random()<.5)sever(b,B.i,mx+rnd(-5,5),my+rnd(-5,5))}
      b.shock+=60;if(b.alive)b.ko=Math.max(b.ko,120)}
    else if(b.kind==='barrel'||b.kind==='c4'||b.kind==='grenade'){const c=b.points[0];if(Math.hypot(c.x-x,c.y-y)<R*0.9&&!b.exploded){b.fuse=Math.min(b.fuse>0?b.fuse:999,rnd(4,14));b.armed=true}}
    else if(b.kind==='crate'||b.kind==='plank'){const c=b.points[0];if(Math.hypot(c.x-x,c.y-y)<R*0.6)b.burn=Math.max(b.burn,300)}
  }
  for(let i=0;i<40;i++){const a=rnd(0,Math.PI*2),s=rnd(1,9)*power;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(20,40),max:40,type:'fire',s:rnd(8,22)*power})}
  for(let i=0;i<30;i++){const a=rnd(0,Math.PI*2),s=rnd(.5,4)*power;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:rnd(60,120),max:120,type:'smoke',s:rnd(14,30)*power})}
  for(let i=0;i<40;i++){const a=rnd(0,Math.PI*2),s=rnd(4,16)*power;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(15,35),max:35,type:'spark',s:2})}
  fx.push({x,y,vx:0,vy:0,life:10,max:10,type:'flash',s:R*1.3});
  {const gy=groundY(x);if(y>gy-R*0.6&&!fluidAt(x,gy-4)){sctx.fillStyle='rgba(15,12,10,0.55)';sctx.beginPath();sctx.ellipse(x,gy+3,R*0.45,9,0,0,Math.PI*2);sctx.fill()}}
  for(const o of bodies)if(o.kind==='balloon'&&Math.hypot(o.points[0].x-x,o.points[0].y-y)<R)o.popMe=true;
  for(const o of bodies)if(o.kind==='person'&&o.alive){const d=Math.hypot(o.points[1].x-x,o.points[1].y-y);if(d<650&&d>40)scare(o,x,260)}
  shake=Math.max(shake,16*power);sfx('boom',power);
}
function ignite(x,y){
  let best=null,bd=40;
  for(const b of bodies){if(b.kind==='person'){for(const B of b.bones){if(B.gone)continue;segClosest(x,y,x,y,B.a.x,B.a.y,B.b.x,B.b.y);const d=Math.hypot(SC.x1-SC.x2,SC.y1-SC.y2)-B.r;if(d<bd){bd=d;best=[b,B]}}}
    else{for(const c of b.caps){prepCap(c);segClosest(x,y,x,y,c.ex0,c.ey0,c.ex1,c.ey1);const d=Math.hypot(SC.x1-SC.x2,SC.y1-SC.y2)-c.r;if(d<bd){bd=d;best=[b,null]}}}}
  if(best){if(best[1]){best[1].burn=400;say(best[0],'HOT!')}else{best[0].burn=500;if(best[0].kind==='barrel'||best[0].kind==='c4'){best[0].armed=true;best[0].fuse=best[0].fuse>0?best[0].fuse:120}}}
  for(let i=0;i<12;i++)fx.push({x:x+rnd(-6,6),y,vx:rnd(-.5,.5),vy:-rnd(1,3),life:30,max:30,type:'fire',s:rnd(5,10)});
  sfx('whoosh');
}

const GUNS={
  pistol:{len:32,m:[0.6,0.4],dmg:28,pen:1.3,pel:1,spread:.015,force:5,recoil:4,auto:0,snd:1},
  rifle:{len:86,m:[1.2,0.8],dmg:46,pen:2.3,pel:1,spread:.03,force:7,recoil:2.5,auto:5,snd:1.3},
  shotgun:{len:80,m:[1.3,0.9],dmg:15,pen:1,pel:9,spread:.16,force:4.5,recoil:9,auto:0,snd:1.8},
  sniper:{len:118,m:[1.5,1],dmg:125,pen:4.5,pel:1,spread:.002,force:16,recoil:10,auto:0,snd:2.2},
};
function fireGun(g){
  const R=g.points[0],M=g.points[1];let dx=M.x-R.x,dy=M.y-R.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const sp=g.spec;
  for(let i=0;i<sp.pel;i++){const a=Math.atan2(dy,dx)+rnd(-sp.spread,sp.spread);shoot(M.x+dx*4,M.y+dy*4,Math.cos(a),Math.sin(a),sp,g)}
  kick(M,-dx*sp.recoil+dy*sp.recoil*0.5*(g.flip||1),-dy*sp.recoil-dx*sp.recoil*0.5*(g.flip||1));kick(R,-dx*sp.recoil*0.7,-dy*sp.recoil*0.7);
  fx.push({x:M.x+dx*8,y:M.y+dy*8,vx:0,vy:0,life:4,max:4,type:'muzzle',s:10+sp.snd*6,a:Math.atan2(dy,dx)});
  for(let i=0;i<4;i++)fx.push({x:M.x,y:M.y,vx:dx*rnd(.5,2),vy:dy*rnd(.5,2)-.4,life:rnd(20,40),max:40,type:'smoke',s:rnd(4,8)});
  gibs.push({x:R.x+dx*10,y:R.y+dy*10,px:R.x+dx*10+dy*2,py:R.y+dy*10+2,r:1.6,type:'shell',rot:0,vr:0.4,bl:0,seed:0});if(gibs.length>320)gibs.shift();
  sfx('shot',sp.snd);shake=Math.max(shake,sp.snd*1.5);
  for(const o of bodies)if(o.kind==='person'&&o.alive&&Math.hypot(o.points[1].x-M.x,o.points[1].y-M.y)<420&&Math.random()<0.6)scare(o,M.x,180);
}
function shoot(x,y,dx,dy,spec,src){
  const L=2600,ex=x+dx*L,ey=y+dy*L;const hits=[];
  for(const b of bodies){if(b===src||b.deleted||b.kind==='rope'||b.kind==='anchor')continue;for(const c of b.caps){if(c.off)continue;prepCap(c);
    if(Math.max(x,ex)<c.x0||Math.min(x,ex)>c.x1||Math.max(y,ey)<c.y0||Math.min(y,ey)>c.y1)continue;
    segClosest(x,y,ex,ey,c.ex0,c.ey0,c.ex1,c.ey1);const d=Math.hypot(SC.x1-SC.x2,SC.y1-SC.y2);if(d<c.r+0.5){const back=Math.sqrt(Math.max(0,(c.r+.5)**2-d*d));hits.push({c,s:SC.s*L-back,t:SC.t,x:SC.x1-dx*back,y:SC.y1-dy*back})}}}
  let endS=L;let hitSolid=false;for(const so of SOLIDS){let t0=0,t1=L;for(const [o,dd,a,b2] of [[x,dx,so.x0,so.x1],[y,dy,so.y0,so.y1]]){if(Math.abs(dd)<1e-9){if(o<a||o>b2){t0=1e9;break}}else{let ta=(a-o)/dd,tb=(b2-o)/dd;if(ta>tb)[ta,tb]=[tb,ta];t0=Math.max(t0,ta);t1=Math.min(t1,tb)}}if(t0<=t1&&t0<endS&&t0>0){endS=t0;hitSolid=true}}if(dy<0){const s=(RY-y)/dy;if(s<endS)endS=s}if(dx<0){const s=(WL-x)/dx;if(s<endS)endS=s}if(dx>0){const s=(WR-x)/dx;if(s<endS)endS=s}
  hits.sort((a,b)=>a.s-b.s);let power=spec.pen;const seen=new Set();let stop=endS;
  for(const h of hits){if(h.s>endS)break;const c=h.c,b=c.body;
    if(b.kind==='person'){const B=b.bones[c.bone];if(!B||B.gone||seen.has(B))continue;seen.add(B);
      hurt(b,c.bone,spec.dmg*Math.min(1,power),'bullet',h.x,h.y,-dx,-dy);
      const f=spec.force*Math.min(1,power);kick(c.a,dx*f*(1-h.t),dy*f*(1-h.t));kick(c.b,dx*f*h.t,dy*f*h.t);
      spray(h.x+dx*B.r*2,h.y+dy*B.r*2,dx,dy,12,7);bgSplat(h.x+dx*B.r,h.y+dy*B.r,dx,dy,16,0.35);
      if(B.orig===0&&Math.random()<.4){b.ko=Math.max(b.ko,300)}
      power-=b.bones[c.bone]&&B.orig>=2&&B.orig<=3?1.1:0.7;
      if(power<=0){stop=h.s;break}
    }else{
      const f=spec.force*0.8;kick(c.a,dx*f,dy*f);if(c.b!==c.a)kick(c.b,dx*f,dy*f);
      for(let i=0;i<6;i++)fx.push({x:h.x,y:h.y,vx:-dx*rnd(1,4)+rnd(-2,2),vy:-dy*rnd(1,4)+rnd(-2,2),life:rnd(8,18),max:18,type:'spark',s:1.5});
      if(b.kind==='balloon'){b.popMe=true;continue}
      if(b.kind==='barrel'){b.hp-=spec.dmg;if(b.hp<=0){b.armed=true;b.fuse=1}}
      if(b.kind==='c4'||b.kind==='grenade'){b.armed=true;b.fuse=1}
      power-=(b.kind==='crate'||b.kind==='plank')?1.2:3;sfx('ping');
      if(power<=0){stop=h.s;break}
    }
  }
  const hx=x+dx*stop,hy=y+dy*stop;
  for(const f of FLUIDS)if(dy>0){const t=(f.y0-y)/dy;if(t>0&&t<stop){const sx=x+dx*t;if(sx>f.x0&&sx<f.x1)splash(f,sx,5,2)}}
  if(stop===endS&&hitSolid)for(let i=0;i<5;i++)fx.push({x:hx,y:hy-1,vx:rnd(-2,2),vy:-rnd(1,4),life:rnd(15,30),max:30,type:'dust',s:rnd(2,4)});
  tracers.push({x1:x,y1:y,x2:hx,y2:hy,life:6});
}

// ================= items =================
function lineItem(kind,x,y,len,m0,m1){const b=mkBody(kind);const A=addP(b,x-len/2,y,4,m0),T=addP(b,x+len/2,y,3,m1);addS(b,A,T,1);return b}
function boxItem(kind,x,y,w,h,m,r=3){const b=mkBody(kind);const q=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(d=>addP(b,x+d[0],y+d[1],r,m/4));
  for(let i=0;i<4;i++)addS(b,q[i],q[(i+1)%4],1);addS(b,q[0],q[2],1);addS(b,q[1],q[3],1);for(let i=0;i<4;i++)addC(b,q[i],q[(i+1)%4],r);b.w=w;b.h=h;return b}
const BLADES={knife:{len:46,h:0.38,r:2,hr:3,sharp:1,m:[0.45,0.35]},sword:{len:112,h:0.2,r:2.5,hr:3,sharp:1.4,m:[0.9,0.6]},spear:{len:160,h:0.86,r:2.5,hr:3,sharp:1.2,m:[1,0.7]}};
const SPAWN={
  human:(x,y)=>spawnHuman(x,y),
  crowd:(x,y)=>{for(let i=0;i<5;i++)spawnHuman(clamp(x+(i-2)*55,30,W-30),y)},
  knife:(x,y)=>blade('knife',x,y),sword:(x,y)=>blade('sword',x,y),spear:(x,y)=>blade('spear',x,y),
  axe:(x,y)=>{const b=lineItem('axe',x,y,78,0.5,2.4);addC(b,b.points[0],b.points[1],3);addC(b,b.points[1],b.points[1],8,{sharp:1.9});return b},
  sledge:(x,y)=>{const b=lineItem('sledge',x,y,90,0.8,6);addC(b,b.points[0],b.points[1],3.2);addC(b,b.points[1],b.points[1],10);return b},
  bat:(x,y)=>{const b=lineItem('bat',x,y,95,0.5,1.4);addC(b,b.points[0],b.points[1],5);return b},
  chainsaw:(x,y)=>{const b=lineItem('chainsaw',x,y,100,3,0.8);addC(b,b.points[0],b.points[1],9,{s1:0.38});addC(b,b.points[0],b.points[1],5,{s0:0.38,saw:true});b.on=false;return b},
  pistol:(x,y)=>gun('pistol',x,y),rifle:(x,y)=>gun('rifle',x,y),shotgun:(x,y)=>gun('shotgun',x,y),sniper:(x,y)=>gun('sniper',x,y),
  grenade:(x,y)=>{const b=mkBody('grenade');const p=addP(b,x,y,7,0.9);addC(b,p,p,7);b.fuse=0;b.armed=false;return b},
  c4:(x,y)=>{const b=boxItem('c4',x,y,36,20,1.2);b.fuse=0;b.armed=false;return b},
  barrel:(x,y)=>{const b=boxItem('barrel',x,y,38,54,5);b.hp=60;b.fuse=0;return b},
  crate:(x,y)=>boxItem('crate',x,y,56,56,6),
  brick:(x,y)=>boxItem('brick',x,y,34,17,3.5),
  anvil:(x,y)=>boxItem('anvil',x,y,70,36,30,4),
  plank:(x,y)=>{const b=lineItem('plank',x,y,160,1.6,1.6);addC(b,b.points[0],b.points[1],5);return b},
  ball:(x,y)=>{const b=mkBody('ball');const p=addP(b,x,y,17,1);p.bounce=0.75;p.fr=0.2;addC(b,p,p,17);b.col=pick(['#d23b3b','#3b7bd2','#e0c030','#3aa55a']);return b},
  spikes:(x,y)=>{const b=mkBody('spikes');const by=Math.min(y,floorBelow(x,y));const n=7;
    for(let i=0;i<n;i++){const sx=x+(i-(n-1)/2)*15;const a=addP(b,sx,by-6,3,1),t=addP(b,sx,by-46,2,1);pinPoint(a,true);pinPoint(t,true);addC(b,a,t,2.5,{sharp:1.3,tip:t})}
    b.bx=x;b.by=by;b.nodrag=true;return b},
  saw:(x,y)=>{const b=mkBody('saw');const p=addP(b,x,Math.min(y,floorBelow(x,y)-42),42,5);pinPoint(p,true);addC(b,p,p,40,{saw:true});b.on=true;b.rot=0;return b},
  press:(x,y)=>{const b=mkBody('press');const top=Math.max(80,Math.min(y,floorBelow(x,y)-200));const w=140,h=40;
    const q=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(d=>{const p=addP(b,x+d[0],top+d[1],4,5);pinPoint(p,true);return p});
    addC(b,q[0],q[1],4);addC(b,q[1],q[2],4);addC(b,q[3],q[0],4);addC(b,q[2],q[3],6,{crush:true});
    Object.assign(b,{top,cx:x,y:top,vy:0,on:false,dir:1,wait:0,nodrag:true,w,h});return b},
  balloon:(x,y)=>{const b=mkBody('balloon');const t=addP(b,x,y,13,1),k=addP(b,x,y+28,2,0.1);addS(b,t,k,1,{rope:true,len:28});addC(b,t,t,13);b.col=pick(['#e03a3a','#e8c547','#3a8de0','#3ac46a','#d04ad0']);
    b.force=bb=>{const q=bb.points[0];if(gravityOn)q.ay-=G*9;q.px+=(q.x-q.px)*0.03};
    const tgt=nearestPoint(x,y+70,50,o=>o.kind!=='rope'&&o.kind!=='balloon'&&o!==b&&o.kind!=='anchor');if(tgt)makeRope(k,tgt);return b},
  thruster:(x,y)=>{const b=boxItem('thruster',x,y,32,16,2);b.on=false;b.force=bb=>{if(!bb.on)return;const [p0,p1]=bb.points;let dx=p1.x-p0.x,dy=p1.y-p0.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;for(const p of bb.points){p.ax+=dx*7;p.ay+=dy*7}};return b},
  s_heal:(x,y)=>syringe(x,y,'heal','#38c46a'),s_sleep:(x,y)=>syringe(x,y,'sleep','#3d7ee0'),s_adren:(x,y)=>syringe(x,y,'adren','#f0a020'),s_acid:(x,y)=>syringe(x,y,'acid','#9be03a'),
};
function blade(k,x,y){const s=BLADES[k];const b=lineItem(k,x,y,s.len,s.m[0],s.m[1]);const [A,T]=b.points;addC(b,A,T,s.hr,{s1:s.h});addC(b,A,T,s.r,{s0:s.h,sharp:s.sharp,tip:T});return b}
function gun(k,x,y){const s=GUNS[k];const b=lineItem(k,x,y,s.len,s.m[0],s.m[1]);b.spec=s;b.gun=true;b.cd=0;addC(b,b.points[0],b.points[1],k==='pistol'?5:4.5);return b}
function syringe(x,y,t,col){const b=lineItem('syringe',x,y,44,0.25,0.15);const [A,T]=b.points;addC(b,A,T,4,{s1:0.72});addC(b,A,T,1.5,{s0:0.72,sharp:0.5,tip:T});b.inject=t;b.col=col;b.used=false;return b}

function useItem(b){
  if(!b)return;
  if(b.gun){if(!b.spec.auto||b.cd<=0){fireGun(b);b.cd=b.spec.auto||0}}
  else if(b.kind==='grenade'&&!b.armed){b.armed=true;b.fuse=150;sfx('click')}
  else if(b.kind==='c4'&&!b.armed){b.armed=true;b.fuse=100;sfx('click')}
  else if(b.kind==='barrel'){b.armed=true;b.fuse=1}
  else if(b.kind==='chainsaw'||b.kind==='saw'||b.kind==='thruster'){b.on=!b.on;sfx('click')}
  else if(b.kind==='balloon'){popBalloon(b)}
  else if(b.kind==='press'){b.on=!b.on;sfx('click')}
  else if(b.kind==='person'){say(b,pick(['hey!','stop poking me','what?','ow']))}
}
function updateItem(b,ts){
  if(b.gun&&b.cd>0)b.cd-=ts;
  if(b.armed&&b.fuse>0){b.fuse-=ts;if(b.kind==='c4'&&Math.floor(b.fuse)%20===0&&Math.random()<.5)sfx('beep');
    if(b.fuse<=0&&!b.exploded){b.exploded=true;const c=centroid(b);removeBody(b);explode(c[0],c[1],b.kind==='c4'?1.7:b.kind==='barrel'?1.35:1.1);return}}
  if(b.kind==='barrel'&&b.hp<=0&&!b.armed){b.armed=true;b.fuse=1}
  if(b.kind==='saw'&&b.on)b.rot+=0.45*ts;
  if(b.kind==='thruster'&&b.on){const [p0,p1,p2,p3]=b.points;const bx=(p0.x+p3.x)/2,by=(p0.y+p3.y)/2;let dx=p1.x-p0.x,dy=p1.y-p0.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;for(let k=0;k<2;k++)fx.push({x:bx-dx*4,y:by-dy*4,vx:-dx*rnd(4,8)+rnd(-.6,.6),vy:-dy*rnd(4,8)+rnd(-.6,.6),life:rnd(8,16),max:16,type:'thrust',s:rnd(5,9)});if(Math.random()<.3)sfx('motor')}
  if(b.kind==='chainsaw'&&b.on){b.rot=(b.rot||0)+ts;if(Math.random()<.2)sfx('motor')}
  if(b.burn>0){b.burn-=ts;const c=centroid(b);if(Math.random()<.7*ts)fx.push({x:c[0]+rnd(-15,15),y:c[1]+rnd(-10,10),vx:rnd(-.4,.4),vy:-rnd(1,2.5),life:rnd(18,32),max:32,type:'fire',s:rnd(5,11)});
    if((b.kind==='barrel'||b.kind==='c4')&&!b.armed){b.armed=true;b.fuse=90}
    // spread to people touching
    if(Math.random()<.05)for(const o of bodies)if(o.kind==='person')for(const B of o.bones)if(!B.gone&&Math.hypot(B.a.x-c[0],B.a.y-c[1])<45)B.burn=Math.max(B.burn,150)}
}
function kinematic(b){
  if(b.kind!=='press')return;
  const bottom=groundY(b.cx)-b.h/2-2;let vy=0;
  if(b.on){if(b.wait>0){b.wait-=DT}else{vy=b.dir>0?3.2:-1.6;b.y+=vy*DT;if(b.y>=bottom){b.y=bottom;b.dir=-1;b.wait=25}if(b.y<=b.top){b.y=b.top;b.dir=1;b.wait=15}}}
  b.vy=vy;const q=b.points;const w=b.w,h=b.h;const ds=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]];
  q.forEach((p,i)=>{p.px=p.x;p.py=p.y;p.x=b.cx+ds[i][0];p.y=b.y+ds[i][1]});
}
function centroid(b){let x=0,y=0;for(const p of b.points){x+=p.x;y+=p.y}return [x/b.points.length,y/b.points.length]}
function popBalloon(b){if(b.deleted)return;const p=b.points[0];removeBody(b);for(let i=0;i<8;i++)fx.push({x:p.x,y:p.y,vx:rnd(-3,3),vy:rnd(-3,2),life:20,max:20,type:'spark',s:1});sfx('balloon')}
function removeBody(b){

  else{const brain=g.type==='brain';ctx.beginPath();const n=7;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=g.r*(0.7+((g.seed*(i+3))%7)/14);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();
    const gg=ctx.createRadialGradient(-g.r*0.3,-g.r*0.3,0,0,0,g.r);gg.addColorStop(0,brain?'#f0b6ba':'#c2403a');gg.addColorStop(1,brain?'#a8646c':'#5a0606');ctx.fillStyle=gg;ctx.fill();
    if(brain){ctx.strokeStyle='rgba(120,50,60,0.6)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(-g.r*0.6,0);ctx.quadraticCurveTo(0,-g.r*0.5,g.r*0.6,0);ctx.stroke()}
    else if(g.seed%3===0){ctx.fillStyle='#d8c27a';ctx.beginPath();ctx.arc(g.r*0.3,-g.r*0.2,g.r*0.3,0,7);ctx.fill()}
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(-g.r*0.35,-g.r*0.35,g.r*0.2,0,7);ctx.fill()}
  ctx.restore()}
function drawShadows(){
  ctx.fillStyle='#000';
  for(const b of bodies){if(b.kind==='rope')continue;
    if(b.kind==='person'){for(const B of b.bones){if(B.gone)continue;const mx=(B.a.x+B.b.x)/2,my=Math.max(B.a.y,B.b.y)+B.r;const GYs=groundY(mx);if(fluidAt(mx,GYs-3))continue;const h=GYs-my;if(h>260||h<-8)continue;const k=1-Math.max(0,h)/260;ctx.globalAlpha=0.22*k;ctx.beginPath();ctx.ellipse(mx,GYs+1.5,Math.abs(B.a.x-B.b.x)/2+B.r*1.3+h*0.06,2.2+2*k,0,0,7);ctx.fill()}}
    else{let x0=1e9,x1=-1e9,y1=-1e9;for(const p of b.points){x0=Math.min(x0,p.x-p.r);x1=Math.max(x1,p.x+p.r);y1=Math.max(y1,p.y+p.r)}const GYs=groundY((x0+x1)/2);if(fluidAt((x0+x1)/2,GYs-3))continue;const h=GYs-y1;if(h>260||h<-5)continue;const k=1-Math.max(0,h)/260;ctx.globalAlpha=0.28*k;ctx.beginPath();ctx.ellipse((x0+x1)/2,GYs+1.5,(x1-x0)/2+h*0.08+2,2.5+2*k,0,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
}
function applyView(sx,sy){const S=scale*cam.z;ctx.setTransform(S,0,0,S,ox+W*scale/2-cam.x*S+sx*S,oy+H*scale/2-cam.y*S+sy*S)}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0e1011';ctx.fillRect(0,0,cv.width,cv.height);
  const sx=reduceMotion?0:rnd(-shake,shake),sy=reduceMotion?0:rnd(-shake,shake);
  applyView(sx,sy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.drawImage(bgc,0,0,W,H);ctx.drawImage(stain,0,0,W,H);
  drawShadows();
  for(const b of bodies)if(b.kind==='press'||b.kind==='spikes'||b.kind==='saw')drawItem(b);
  for(const b of bodies)if(b.kind==='person')drawPerson(b);
  for(const b of bodies)if(b.kind!=='person'&&b.kind!=='press'&&b.kind!=='spikes'&&b.kind!=='saw')drawItem(b);
  for(const g of gibs)drawGib(g);
  for(const f of fx)if(f.type==='cloud'){const k=f.life/f.max;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s);g.addColorStop(0,`rgba(120,5,10,${k*0.28})`);g.addColorStop(1,'rgba(120,5,10,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
  drawFluids();
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(100,0,0,0.92)';
  for(const d of blood){ctx.lineWidth=d.r*1.5;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.vx*0.7,d.y-d.vy*0.7);ctx.stroke()}
  for(const f of fx)if(f.type==='smoke'){const k=f.life/f.max;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s);g.addColorStop(0,`rgba(70,70,72,${k*0.35})`);g.addColorStop(1,'rgba(70,70,72,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='dust'){const k=f.life/f.max;ctx.fillStyle=`rgba(150,145,135,${k*0.6})`;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='heal'){const k=f.life/f.max;ctx.fillStyle=`rgba(90,230,130,${k})`;ctx.fillRect(f.x-f.s/2,f.y-1.5,f.s,3);ctx.fillRect(f.x-1.5,f.y-f.s/2,3,f.s)}
    else if(f.type==='steam'){const k=f.life/f.max;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s);g.addColorStop(0,`rgba(235,235,235,${k*0.3})`);g.addColorStop(1,'rgba(235,235,235,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='drop'){ctx.fillStyle='rgba(190,230,245,0.8)';ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='bubble'){ctx.strokeStyle='rgba(230,250,255,0.7)';ctx.lineWidth=0.8;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.stroke()}
    else if(f.type==='acid'){const k=f.life/f.max;ctx.fillStyle=`rgba(150,230,60,${k*0.5})`;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
  ctx.globalCompositeOperation='lighter';
  for(const f of fx){const k=f.life/f.max;
    if(f.type==='fire'){const r=f.s*(0.5+k*0.6);const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,`rgba(255,${(170+k*70)|0},${(60*k)|0},${k*0.75})`);g.addColorStop(1,'rgba(255,80,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.fill()}
    else if(f.type==='lavadrop'){ctx.fillStyle=`rgba(255,${(120+k*100)|0},30,${Math.min(1,k*1.5)})`;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='ember'){ctx.fillStyle=`rgba(255,${(140+k*80)|0},40,${k})`;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='lavabub'){ctx.strokeStyle=`rgba(255,220,120,${k})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(f.x,f.y,f.s*(1.2-k),Math.PI,0);ctx.stroke()}
    else if(f.type==='thrust'){const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s);g.addColorStop(0,`rgba(180,220,255,${k})`);g.addColorStop(0.4,`rgba(255,160,60,${k*0.6})`);g.addColorStop(1,'rgba(255,100,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill()}
    else if(f.type==='spark'){ctx.strokeStyle=`rgba(255,210,120,${k})`;ctx.lineWidth=f.s;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx,f.y-f.vy);ctx.stroke()}
    else if(f.type==='flash'){const r=f.s*(1.2-k*0.4);const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,`rgba(255,245,220,${k*0.9})`);g.addColorStop(0.4,`rgba(255,170,60,${k*0.4})`);g.addColorStop(1,'rgba(255,120,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.fill()}
    else if(f.type==='muzzle'){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);const g=ctx.createRadialGradient(4,0,0,4,0,f.s*1.6);g.addColorStop(0,`rgba(255,250,220,${k})`);g.addColorStop(0.5,`rgba(255,180,60,${k*0.6})`);g.addColorStop(1,'rgba(255,120,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-3,-f.s*0.45);ctx.lineTo(f.s*1.8,0);ctx.lineTo(-3,f.s*0.45);ctx.fill();ctx.beginPath();ctx.arc(0,0,f.s*0.6,0,7);ctx.fill();ctx.restore()}}
  for(const t of tracers){ctx.strokeStyle=`rgba(255,225,150,${t.life/6*0.8})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.stroke()}
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(vigc,0,0,W,H);
  for(let i=cutTrail.length-1;i>=0;i--){if((cutTrail[i].life-=1)<=0)cutTrail.splice(i,1)}
  if(cutTrail.length>1){ctx.strokeStyle='rgba(230,240,255,0.7)';ctx.lineWidth=1.5;ctx.beginPath();cutTrail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
  const fs=14/Math.pow(cam.z,0.75);ctx.font=`600 ${fs}px "Avenir Next Condensed","Chakra Petch",sans-serif`;ctx.textAlign='center';
  for(const b of bubbles){const h=b.P.points[0];const a=Math.min(1,b.life/20);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.strokeStyle=`rgba(0,0,0,${a*0.8})`;ctx.lineWidth=fs/4.5;ctx.strokeText(b.t,h.x,h.y-18-fs/2);ctx.fillText(b.t,h.x,h.y-18-fs/2)}
  if(ropeStart){ctx.strokeStyle='rgba(160,122,69,0.7)';ctx.setLineDash([6,5]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ropeStart.x,ropeStart.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();ctx.setLineDash([])}
  if(drag){ctx.strokeStyle='rgba(232,197,71,0.8)';ctx.lineWidth=1.2/cam.z;ctx.beginPath();ctx.moveTo(drag.x,drag.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();ctx.fillStyle='#e8c547';ctx.beginPath();ctx.arc(drag.x,drag.y,3/cam.z+1,0,7);ctx.fill()}
  else if(tool==='drag'||tool==='spawn'||tool==='use'){const p=nearestPoint(mouse.x,mouse.y,tool==='spawn'?14:30);if(p){ctx.strokeStyle='rgba(232,197,71,0.6)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(6,Math.min(p.r,14))+3,0,7);ctx.stroke()}}
  ctx.restore();
}

// ================= main loop =================
function loop(){
  if(!paused){const ts=slow?0.25:1;DT=ts/SUB;for(let i=0;i<SUB;i++)step();frameUpdate(ts);frame++}
  render();drawECG(slow?0.25:1);if(frame%6===0)updateInfo();
  requestAnimationFrame(loop);
}
function initScene(){
  const gy=GY;
  if(MAPID==='lab'){spawnHuman(520,gy-90);spawnHuman(760,gy-90);spawnHuman(1000,gy-90);SPAWN.knife(300,gy-40);SPAWN.pistol(380,gy-30);SPAWN.axe(1180,gy-30);SPAWN.crate(1300,gy-40);SPAWN.spikes(1450,gy)}
  else if(MAPID==='flooded'){spawnHuman(420,gy-90);spawnHuman(800,gy-90);spawnHuman(1180,gy-90);SPAWN.crate(600,700);SPAWN.ball(1000,700);SPAWN.barrel(1350,720);SPAWN.plank(250,700)}
  else if(MAPID==='pool'){spawnHuman(180,gy-90);spawnHuman(330,gy-90);spawnHuman(1280,gy-90);spawnHuman(1440,gy-90);spawnHuman(800,560);SPAWN.ball(650,640);SPAWN.crate(950,630);SPAWN.plank(820,640)}
  else if(MAPID==='lava'){spawnHuman(200,gy-90);spawnHuman(360,gy-90);spawnHuman(1240,gy-90);spawnHuman(1420,gy-90);SPAWN.plank(800,gy-120);SPAWN.crate(460,gy-40);SPAWN.barrel(1150,gy-40);SPAWN.sledge(300,gy-20)}
}
function loadMap(id){
  MAP=MAPS[id];MAPID=id;GY=MAP.gy;
  SOLIDS=MAP.solids.map(a=>({x0:a[0],y0:a[1],x1:a[2],y1:a[3]}));
  FLUIDS=MAP.fluids.map(f=>{const n=Math.ceil((f.x1-f.x0)/8)+1;return {...f,n,h:new Float32Array(n),v:new Float32Array(n),tint:0,t:0,blobs:Array.from({length:Math.round((f.x1-f.x0)/35)},()=>({x:rnd(f.x0,f.x1),y:rnd(f.y0+8,f.y1),r:rnd(8,26),vx:rnd(-0.2,0.2)}))}});
  clearAll();cam.z=1;cam.x=W/2;cam.y=H/2;syncZoom();buildBG();initScene();syncMaps();
}
resize();setTool('drag');syncTop();loadMap('lab');if(document.fonts&&document.fonts.ready)document.fonts.ready.then(buildBG);requestAnimationFrame(loop);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(cv.parentElement);
</script>
